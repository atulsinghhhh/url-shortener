name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  ci-check:
    name: Run CI Checks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test Backend
        working-directory: backend
        run: |
          bun install
          bun test
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build Frontend
        working-directory: frontend
        run: |
          bun install
          bun run build


  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: ci-check

    env:
      BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/url-shortener-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/url-shortener-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Images pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.BACKEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.FRONTEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tagged with commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY